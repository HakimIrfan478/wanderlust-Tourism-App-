name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Torch is not installed in CI, so the semantic backend is switched off
      # explicitly rather than left to fail at import. The TF-IDF baseline and
      # every fallback path are still exercised, which is the point: the app
      # has to work on a machine that cannot run the transformer.
      DISABLE_SEMANTIC_MODEL: "1"
      USE_SQLITE: "1"
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DJANGO_DEBUG: "0"
      LOG_LEVEL: ERROR

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Seed the catalogue
        run: python manage.py seed_destinations

      - name: Validate the labelled query set
        run: python manage.py run_evaluation --validate

      - name: Run the evaluation (TF-IDF baseline only)
        run: python manage.py run_evaluation --models tfidf --no-save

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the app config parses
        run: node -e "JSON.parse(require('fs').readFileSync('app.json','utf8')); console.log('app.json ok')"

      - name: Syntax-check every source file
        # Babel parses the JSX that plain `node --check` cannot.
        run: npm run check
